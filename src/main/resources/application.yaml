spring:
  application:
    # Define o nome identificador que corresponde ao arquivo de configuração no Git.
    name: usuario-service
  config:
    # Importa as configurações remotas do servidor Config Server na inicialização.
    import: "configserver:http://localhost:8888"

eureka:
  client:
    service-url:
      # Define o endereço base do servidor Eureka para registrar este microsserviço.
      defaultZone: http://localhost:8761/eureka/